<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💜 Guarda-Roupa Mágico — Estilo ARMY 💜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #2d0c5e, #4b1b96, #2d0c5e);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .coracao {
      position: fixed;
      color: #c084fc;
      font-size: 20px;
      animation: cair linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes cair {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    .aba {
      transition: all 0.3s ease;
    }
    .aba.ativa {
      background: linear-gradient(90deg, #a855f7, #7c3aed);
      color: white;
      font-weight: bold;
    }
    .conteudo {
      display: none;
    }
    .conteudo.visivel {
      display: block;
      animation: aparecer 0.5s ease;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cartao {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(192,132,252,0.3);
      border-radius: 16px;
    }
  </style>
</head>
<body class="text-white">
  <!-- Corações caindo -->
  <div id="coracoes"></div>

  <!-- Música -->
  <div class="fixed top-4 right-4 z-50">
    <button id="botaoMusica" class="bg-purple-500/80 rounded-full w-14 h-14 flex items-center justify-center text-2xl">
      <i class="fa fa-pause"></i>
    </button>
    <audio id="musica" loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    
  </div>

  <!-- Conteúdo Principal -->
  <div class="container mx-auto px-4 py-8 relative z-10">
    <h1 class="text-3xl md:text-4xl font-bold text-center mb-8">
      💜 Guarda-Roupa Mágico 💜<br>
      <span class="text-lg text-purple-300">Estilo ARMY</span>
    </h1>

    <!-- Abas -->
    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <button class="aba ativa px-5 py-3 rounded-full bg-white/10" data-alvo="hoje">Hoje</button>
      <button class="aba px-5 py-3 rounded-full bg-white/10" data-alvo="semana">Semana</button>
      <button class="aba px-5 py-3 rounded-full bg-white/10" data-alvo="mes">Mês</button>
      <button class="aba px-5 py-3 rounded-full bg-white/10" data-alvo="favoritos">Favoritos 💜</button>
    </div>

    <!-- Conteúdo das Abas -->
    <div id="hoje" class="conteudo visivel">
      <div class="cartao p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">✨ Roupas de Hoje</h2>
        <p class="text-purple-200 mb-4">Nenhuma peça adicionada ainda!</p>
      </div>
    </div>

    <div id="semana" class="conteudo">
      <div class="cartao p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">📅 Roupas da Semana</h2>
        <p class="text-purple-200 mb-4">Planeje seus looks aqui!</p>
      </div>
    </div>

    <div id="mes" class="conteudo">
      <div class="cartao p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">🌟 Roupas do Mês</h2>
        <p class="text-purple-200 mb-4">Visão geral do mês!</p>
      </div>
    </div>

    <div id="favoritos" class="conteudo">
      <div class="cartao p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">💜 Meus Favoritos</h2>
        <p class="text-purple-200 mb-4">Suas peças especiais!</p>
      </div>
    </div>

    <!-- Formulário -->
    <div class="cartao p-6 mt-8">
      <h2 class="text-xl font-semibold mb-4">➕ Adicionar Peça</h2>
      <form id="formulario" class="space-y-4">
        <div>
          <label class="block mb-1">Nome da peça:</label>
          <input type="text" class="w-full px-4 py-2 rounded-lg bg-white/10 border border-purple-400/30 focus:outline-none focus:border-purple-400" placeholder="Ex: Camiseta roxa do BTS">
        </div>
        <div>
          <label class="block mb-1">Categoria:</label>
          <select class="w-full px-4 py-2 rounded-lg bg-white/10 border border-purple-400/30 focus:outline-none">
            <option>Camiseta</option>
            <option>Calça</option>
            <option>Vestido</option>
            <option>Jaqueta</option>
            <option>Acessório</option>
          </select>
        </div>
        <button type="submit" class="w-full py-3 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 font-bold hover:opacity-90 transition">
          💜 Adicionar ao Guarda-Roupa 💜
        </button>
      </form>
    </div>
  </div>

  <script>
    // Corações caindo
    function criarCoracao() {
      const coracao = document.createElement('div');
      coracao.className = 'coracao';
      coracao.innerHTML = ['💜','⭐','✨','💫'][Math.floor(Math.random()*4)];
      coracao.style.left = Math.random()*100 + 'vw';
      coracao.style.animationDuration = (Math.random()*5+5) + 's';
      document.getElementById('coracoes').appendChild(coracao);
      setTimeout(() => coracao.remove(), 10000);
    }
    setInterval(criarCoracao, 800);

    // Abas
    document.querySelectorAll('.aba').forEach(aba => {
      aba.addEventListener('click', () => {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        aba.classList.add('ativa');
        document.querySelectorAll('.conteudo').forEach(c => c.classList.remove('visivel'));
        document.getElementById(aba.dataset.alvo).classList.add('visivel');
      });
    });

    // Música
    const botao = document.getElementById('botaoMusica');
    const musica = document.getElementById('musica');
    let tocando = true;
    botao.addEventListener('click', () => {
      tocando ? musica.pause() : musica.play();
      botao.innerHTML = `<i class="fa fa-${tocando ? 'play' : 'pause'}"></i>`;
      tocando = !tocando;
    });

    // Formulário
    document.getElementById('formulario').addEventListener('submit', e => {
      e.preventDefault();
      alert('💜 Peça adicionada com sucesso! 💜');
    });
  </script>
</body>
</html>
